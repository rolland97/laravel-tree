# ⚠️ AGENTS.md R-033: every action is pinned to a FULL commit SHA with the
# human-readable version in a trailing comment, and every job declares an
# explicit least-privilege `permissions:` block. A tag is a moving target; a
# SHA is not.
name: tests

on:
  push:
    branches: [main, '00*-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # PHP 8.5 is the platform this package is developed on, and 8.3 is the
        # floor every runtime dependency declares (laravel/framework 13.x,
        # adjacency-list 1.26 and testbench 11 all require ^8.3).
        php: ['8.3', '8.4', '8.5']

        # ⚠️ Laravel 13 ONLY, and both older majors are absent deliberately.
        #
        # Laravel 11: every one of its 108 published releases carries unresolved
        # security advisories, so Composer's default audit refuses to install any
        # of them. No host could adopt the package there.
        #
        # Laravel 12: it WORKS — verified locally at 12.61.1 with Filament 5.6.5
        # — but it has no consumer. The one consumer this package exists for, the
        # consumer application, is on ^13.17, and `^12.0` would advertise ~60
        # patch releases that are advisory-blocked. Widening support later is a
        # MINOR, non-breaking change; narrowing it after publication is breaking.
        # So the range starts narrow and grows when a host actually needs it.
        dependency-version: [prefer-lowest, prefer-stable]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependency-version }}

      # ⚠️ core + bridge ONLY. The browser suite needs Playwright and a real
      # Chromium, and installing it on all six legs would download ~300 MB six
      # times to exercise the same PHP through HTTP. It runs once, in the
      # dedicated job below. The UNION of the two jobs is `composer test`, which
      # is still what a developer runs locally.
      - name: Run the core and bridge suites
        run: vendor/bin/pest --testsuite=core,bridge

  # ⚠️ Its own job because it needs Node and a browser, and because the first CI
  # run ever attempted failed on all six matrix legs with
  # PlaywrightNotInstalledException — the workflow ran `composer test`, which
  # includes the browser suite, on runners that had no Playwright. CLAUDE.md
  # documented the requirement; the workflow did not honour it.
  browser:
    name: browser suite · playwright
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      # ⚠️ resources/dist/ is COMMITTED, so the suite runs against the same
      # compiled bundle a host installs. Rebuilding here would test something the
      # package does not ship — and would hide a stale committed bundle, which is
      # the failure Principle VI names.
      - name: Confirm the committed bundle is current
        run: |
          npm run build
          git diff --exit-code --stat resources/dist/ \
            || (echo "resources/dist/ is STALE — run npm run build and commit it" && exit 1)

      - name: Run the browser suite
        run: vendor/bin/pest --testsuite=browser

  # ⚠️ Research R8 / AGENTS.md R-027. An architecture test over namespaces is NOT
  # a substitute for this job: it proves nothing was *imported*, not that the
  # package *boots*. A conditional provider registration can still fail on a
  # container binding, a facade, or a config default that only exists when
  # Filament is installed. Removing the package is the only check that exercises
  # the real condition.
  core-without-filament:
    name: core suite · filament/filament uninstalled
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Remove Filament
        run: composer remove --dev --no-interaction filament/filament

      - name: Prove Filament is gone
        run: |
          if [ -d vendor/filament ]; then
            echo "vendor/filament still present — this job would prove nothing."
            exit 1
          fi

      - name: Run the core suite
        run: vendor/bin/pest --testsuite=core

  static-analysis:
    name: phpstan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Analyse
        run: composer analyse

  code-style:
    name: pint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Check formatting
        run: composer test:lint
